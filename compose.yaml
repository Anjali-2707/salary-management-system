services:

  frontend:
    build:
      context: ./frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      - backend


  backend:
    build:
      context: ./backend

    ports:
      - "3000:3000"

    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - sqlite_data:/app/data

    environment:
      NODE_ENV: development
      DATABASE_PATH: /app/data/salary-management.db
      HR_EMAIL: hr@acme.com
      HR_PASSWORD: demo123
      JWT_SECRET: local-development-secret-change-me


volumes:
  frontend_node_modules:
  backend_node_modules:
  sqlite_data: